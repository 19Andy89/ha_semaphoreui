run_template:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: semaphore_ui
          model: Template
          multiple: true
    dry_run:
      required: false
      default: false
      selector:
        boolean:
    wait:
      required: false
      default: false
      selector:
        boolean:
    timeout:
      required: false
      default: 600
      selector:
        number:
          min: 5
          max: 7200
          step: 5
          unit_of_measurement: s
          mode: box
    message:
      required: false
      selector:
        text:
    limit:
      required: false
      selector:
        text:
    survey:
      required: false
      selector:
        object:
    raise_on_failure:
      required: false
      default: false
      selector:
        boolean:
    build_version:
      required: false
      example: "1.0.12"
      selector:
        text:
    build_task_id:
      required: false
      selector:
        number:
          min: 1
          mode: box

create_schedule:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: semaphore_ui
          model: Template
          multiple: true
    cron:
      required: false
      example: "0 3 * * 1"
      selector:
        text:
    run_at:
      required: false
      selector:
        datetime:
    delete_after_run:
      required: false
      default: false
      selector:
        boolean:
    name:
      required: false
      selector:
        text:
    active:
      required: false
      default: true
      selector:
        boolean:

update_schedule:
  target:
    entity:
      integration: semaphore_ui
      domain: switch
  fields:
    cron:
      required: false
      example: "30 4 * * *"
      selector:
        text:
    run_at:
      required: false
      selector:
        datetime:
    delete_after_run:
      required: false
      selector:
        boolean:
    name:
      required: false
      selector:
        text:
    template_id:
      required: false
      selector:
        number:
          min: 1
          mode: box
    active:
      required: false
      selector:
        boolean:

delete_schedule:
  target:
    entity:
      integration: semaphore_ui
      domain: switch
