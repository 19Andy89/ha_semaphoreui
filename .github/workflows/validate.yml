name: Validate

# Prüft bei jedem Push, Pull Request und einmal täglich, ob die Integration die Vorgaben
# von Home Assistant (hassfest) und HACS erfüllt.
on:
  push:
    branches-ignore: [main]   # main wird vom Release-Workflow getestet
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"   # Home Assistant 2026.10+ braucht Python 3.14 (ubuntu-24.04 bringt 3.12 mit)
      - run: |
          python3 -m pip install -q -r requirements_test.txt
          python3 -m pytest -q -p no:cacheprovider
  hassfest:
    name: hassfest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
