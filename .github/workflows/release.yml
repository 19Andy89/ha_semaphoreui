name: Release

# Bei jedem Push auf main (Entwicklung läuft auf dev, siehe release-dev.yml; main bekommt nur geprüfte Stände per Pull Request): Aus den Commit-Meldungen (Conventional Commits) wird die nächste Version bestimmt
#   fix:/perf:  -> Patch (0.3.0 -> 0.3.1)      feat: -> Minor (0.3.x -> 0.4.0)      feat!: / BREAKING CHANGE -> Minor (ab 1.0 Major)
#   docs:/chore:/test:/ci:/refactor: -> kein Release
# Danach: manifest.json und Karten-Version setzen, Commit + Tag, semaphore_ui.zip (nur custom_components/semaphore_ui) und GitHub-Release.
# Steht in manifest.json schon eine höhere Version als im letzten Tag, wird genau diese veröffentlicht.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Nächste Version bestimmen
        id: version
        run: python3 .github/scripts/release.py

      - uses: actions/setup-python@v7
        if: steps.version.outputs.released == 'true'
        with:
          python-version: "3.14"   # Home Assistant 2026.10+ braucht Python 3.14 (ubuntu-24.04 bringt 3.12 mit)
      - name: Tests (pytest)
        if: steps.version.outputs.released == 'true'
        run: |
          python3 -m pip install -q -r requirements_test.txt
          python3 -m pytest -q -p no:cacheprovider

      - name: ZIP bauen (nur custom_components/semaphore_ui)
        if: steps.version.outputs.released == 'true'
        run: |
          cd custom_components/semaphore_ui
          zip -r -q ../../semaphore_ui.zip . -x "__pycache__/*" "*.pyc"
          unzip -l ../../semaphore_ui.zip | tail -n 3

      - name: Commit, Tag und Release
        if: steps.version.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:main "v$VERSION"
          gh release create "v$VERSION" semaphore_ui.zip --title "v$VERSION" \
            --notes-file release_notes.md
