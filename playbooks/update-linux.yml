# examples/update-linux.yml – Linux-Gäste aktualisieren und das Ergebnis an Home Assistant melden (HA_RESULT)
---
- name: Linux-Gäste aktualisieren
  hosts: linux_guests
  become: true
  serial: 1

  # Anpassbare Schwellenwerte (über extra-vars oder host_vars überschreibbar):
  #   min_free_space_kib     – absolute Mindestreserve auf / in KiB (Default: 512 MiB)
  #   update_space_buffer_kib – Puffer über dem errechneten Update-Bedarf in KiB (Default: 256 MiB)
  # Bei Root-Partitionen >= 15 GiB wird automatisch eine Mindestreserve von 2 GiB verwendet.
  #
  #   deferred_upgrade_packages – Pakete, die erst NACH dem Lauf installiert werden (Default: Docker).
  #     Hintergrund: Läuft Semaphore selbst in Docker auf diesem Host, startet ein Update von docker-ce/containerd
  #     den Docker-Dienst neu und beendet damit Semaphore samt laufendem Task. Solche Pakete werden deshalb
  #     während des Laufs festgehalten (apt hold), der Lauf endet normal und meldet sein HA_RESULT; danach
  #     installiert ein vom Lauf losgelöster systemd-Job sie (nach deferred_upgrade_delay_seconds).
  #     Leere Liste = alles im Lauf installieren (altes Verhalten).
  #   deferred_upgrade_delay_seconds – Wartezeit, bis Semaphore den Task sicher abgeschlossen hat (Default: 45)
  vars:
    min_free_space_kib: 524288
    update_space_buffer_kib: 262144
    deferred_upgrade_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
      - docker-buildx-plugin
      - docker.io
    deferred_upgrade_delay_seconds: 45

  tasks:
    - name: Erreichbarkeit prüfen
      ansible.builtin.ping:

    - name: Vorprüfungen (Platz, Paketlisten, Updates ermitteln)
      block:
        - name: Freien Speicherplatz prüfen
          ansible.builtin.command: df -P /
          changed_when: false
          check_mode: false
          register: disk_space

        - name: Speicherplatz anzeigen
          ansible.builtin.debug:
            var: disk_space.stdout_lines

        - name: Verfügbaren Speicherplatz für Update prüfen
          ansible.builtin.command:
            argv:
              - df
              - --output=avail
              - -k
              - /
          changed_when: false
          check_mode: false
          register: root_available_kib

        - name: Gesamtgröße der Root-Partition ermitteln
          ansible.builtin.command:
            argv:
              - df
              - --output=size
              - -k
              - /
          changed_when: false
          check_mode: false
          register: root_total_kib

        - name: Adaptive Mindestreserve berechnen
          ansible.builtin.set_fact:
            effective_min_free_kib: >-
              {{
                2097152
                if (root_total_kib.stdout_lines[-1] | int) >= 15728640
                else (min_free_space_kib | int)
              }}

        - name: Paketlisten aktualisieren
          ansible.builtin.apt:
            auto_install_module_deps: true
            update_cache: true
            cache_valid_time: 3600
            update_cache_retries: 3
            update_cache_retry_max_delay: 12
            lock_timeout: 300
          check_mode: false

        - name: Verfügbare Paketupdates ermitteln
          ansible.builtin.command:
            cmd: timeout 120s apt-get -s upgrade
          environment:
            LC_ALL: C
          changed_when: false
          check_mode: false
          register: upgrade_simulation

        - name: Anzahl verfügbarer Paketupdates anzeigen
          ansible.builtin.debug:
            msg: >-
              Paketupdates verfügbar:
              {{ upgrade_simulation.stdout_lines
                 | select('match', '^Inst ')
                 | list
                 | length }}

        # "apt-get -s" (Simulation) gibt die Zeilen "Need to get ..." und "After this operation ..." NICHT aus.
        # "--assume-no" druckt sie und bricht danach ab: es wird nichts installiert und nichts heruntergeladen.
        - name: Platzbedarf der Updates bei apt erfragen (ohne etwas zu installieren)
          ansible.builtin.command:
            cmd: timeout 120s apt-get upgrade --assume-no
          environment:
            LC_ALL: C
          changed_when: false
          failed_when: false
          check_mode: false
          register: upgrade_size

        - name: Benötigten Speicherplatz der Updates berechnen
          ansible.builtin.shell: |
            python3 -c '
            import sys, re
            text = sys.stdin.read()
            units = {"B": 1.0 / 1024.0, "kB": 1.0, "MB": 1024.0, "GB": 1048576.0}
            def conv(num, unit):
                return float(num.replace(",", "")) * units.get(unit, 1.0)
            download = 0.0
            additional = 0.0
            for line in text.splitlines():
                m = re.search(r"Need to get ([\d.,]+)\s*(B|kB|MB|GB)(?:/[\d.,]+\s*(?:B|kB|MB|GB))?\s+of archives", line)
                if m:
                    download = conv(m.group(1), m.group(2))
                m = re.search(r"After this operation, ([\d.,]+)\s*(B|kB|MB|GB) of additional disk space will be (used|freed)\.", line)
                if m:
                    v = conv(m.group(1), m.group(2))
                    additional = v if m.group(3) == "used" else -v
            peak = download + (additional if additional > 0 else 0.0)
            print(int(peak))
            '
          args:
            stdin: "{{ upgrade_size.stdout | default('') }}"
          changed_when: false
          check_mode: false   # sonst überspringt Ansible den Schritt im Testlauf (--check) und der Bedarf steht auf 0 MiB
          register: required_space_kib

        - name: Benötigten Speicherplatz anzeigen
          ansible.builtin.debug:
            msg: >-
              Updates benötigen ca.
              {{ (required_space_kib.stdout | default('0') | trim | int / 1024) | round(1) }} MiB
              (Download + zusätzlicher Platz, ohne {{ (update_space_buffer_kib | int / 1024) | round(0) }} MiB Puffer).

        - name: Update bei zu wenig freiem Speicher verhindern
          ansible.builtin.assert:
            that:
              - (root_available_kib.stdout_lines[-1] | int) >= (required_space_kib.stdout | default('0') | trim | int) + (update_space_buffer_kib | int)
              - (root_available_kib.stdout_lines[-1] | int) >= (effective_min_free_kib | int)
            fail_msg: >-
              Update abgebrochen: Auf / sind nur
              {{ ((root_available_kib.stdout_lines[-1] | int) / 1048576) | round(2) }} GiB frei.
              Benötigt werden ca. {{ (required_space_kib.stdout | default('0') | trim | int / 1024) | round(1) }} MiB für die Updates
              plus {{ (update_space_buffer_kib | int / 1024) | round(0) }} MiB Puffer
              (Mindestreserve {{ (effective_min_free_kib | int / 1024) | round(0) }} MiB).
            success_msg: >-
              Ausreichend Speicherplatz vorhanden:
              {{ ((root_available_kib.stdout_lines[-1] | int) / 1048576) | round(2) }} GiB frei;
              Updates benötigen ca. {{ (required_space_kib.stdout | default('0') | trim | int / 1024) | round(1) }} MiB.

      rescue:
        # Schlägt eine Vorprüfung fehl (zu wenig Platz, apt-Fehler ...), muss Home Assistant das trotzdem erfahren:
        # sonst entsteht der Handlungsbedarf-Sensor des Hosts nie. Danach schlägt der Lauf wie gewohnt fehl.
        - name: Fehlgeschlagene Vorprüfung an Home Assistant melden
          ansible.builtin.debug:
            msg: >-
              HA_RESULT {{ (
                {
                  'needed': true,
                  'notes': ['Update nicht gestartet: ' ~ (ansible_failed_result.msg | default('Vorprüfung fehlgeschlagen') | string | replace('\n', ' ') | truncate(180))]
                }
                | combine(
                    {
                      'disk_free_mib': ((root_available_kib.stdout_lines[-1] | int) / 1024) | round(1),
                      'disk_used_percent': ((1 - ((root_available_kib.stdout_lines[-1] | int) / (root_total_kib.stdout_lines[-1] | int))) * 100) | round(1)
                    }
                    if (root_available_kib.stdout_lines is defined and root_total_kib.stdout_lines is defined
                        and (root_total_kib.stdout_lines[-1] | int) > 0)
                    else {}
                  )
              ) | to_json }}

        - name: Lauf als fehlgeschlagen beenden
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg | default('Vorprüfung fehlgeschlagen') }}"


    - name: Zurückzustellende Pakete bestimmen (nur solche mit anstehendem Update)
      ansible.builtin.set_fact:
        deferred_now: >-
          {{ upgrade_simulation.stdout_lines
             | select('match', '^Inst ')
             | map('regex_replace', '^Inst (\S+).*$', '\1')
             | select('in', deferred_upgrade_packages)
             | list }}

    - name: Zurückgestellte Pakete anzeigen
      ansible.builtin.debug:
        msg: >-
          {{ 'Werden nach dem Lauf im Hintergrund installiert' if not ansible_check_mode
             else 'Würden nach dem Lauf im Hintergrund installiert' }}: {{ deferred_now | join(', ') }}
      when: deferred_now | length > 0

    - name: Pakete aktualisieren (zurückgestellte Pakete bleiben festgehalten)
      block:
        - name: Zurückgestellte Pakete festhalten
          ansible.builtin.dpkg_selections:
            name: "{{ item }}"
            selection: hold
          loop: "{{ deferred_now }}"
          when: not ansible_check_mode

        - name: Installierte Pakete aktualisieren
          ansible.builtin.apt:
            auto_install_module_deps: true
            upgrade: safe
            lock_timeout: 300
            update_cache_retries: 3
            update_cache_retry_max_delay: 12
          register: apt_upgrade
      always:
        # Auch bei einem Fehler: das Festhalten darf nie bestehen bleiben
        - name: Festhalten wieder aufheben
          ansible.builtin.dpkg_selections:
            name: "{{ item }}"
            selection: install
          loop: "{{ deferred_now }}"
          when: not ansible_check_mode

    - name: Neustartbedarf prüfen
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Neustartbedarf anzeigen
      ansible.builtin.debug:
        msg: >-
          Neustart erforderlich: {{ reboot_required.stat.exists }}

    - name: Offene Paketupdates nach dem Lauf ermitteln
      ansible.builtin.command:
        cmd: timeout 120s apt-get -s upgrade
      environment:
        LC_ALL: C
      changed_when: false
      check_mode: false
      register: upgrade_final

    - name: Aktuelle Debian-Stable-Version abfragen
      ansible.builtin.uri:
        url: https://deb.debian.org/debian/dists/stable/Release
        return_content: true
        status_code: 200
        timeout: 10
      register: debian_stable_release
      changed_when: false
      check_mode: false
      failed_when: false
      when: ansible_facts.distribution == "Debian"

    - name: Debian-Metadaten extrahieren
      ansible.builtin.set_fact:
        debian_stable_version_line: >-
          {{
            debian_stable_release.content.splitlines()
            | select('match', '^Version:')
            | list
            | first
            | default('')
          }}
        debian_stable_codename_line: >-
          {{
            debian_stable_release.content.splitlines()
            | select('match', '^Codename:')
            | list
            | first
            | default('')
          }}
      when:
        - ansible_facts.distribution == "Debian"
        - debian_stable_release is not failed
        - debian_stable_release.content is defined

    - name: Debian-Version und Codename extrahieren
      ansible.builtin.set_fact:
        debian_stable_major: "{{ (debian_stable_version_line.split(':', 1)[1] | trim).split('.')[0] | int }}"
        debian_stable_codename: "{{ debian_stable_codename_line.split(':', 1)[1] | trim }}"
      when:
        - debian_stable_version_line is defined
        - debian_stable_version_line is match('^Version:\\s*[0-9]+')
        - debian_stable_codename_line is defined
        - debian_stable_codename_line is match('^Codename:\\s*\\S+')

    - name: Debian-Versionen vergleichen
      ansible.builtin.debug:
        msg: >-
          Installiert: Debian {{ ansible_facts.distribution_major_version }}
          ({{ ansible_facts.distribution_release }}).
          Aktuell stabil: Debian {{ debian_stable_major }}
          ({{ debian_stable_codename }}).
          {{
            'HINWEIS: Distributionsupgrade prüfen!'
            if (ansible_facts.distribution_major_version | int) < (debian_stable_major | int)
            else
            'Hauptversion entspricht der aktuellen Stable-Version.'
            if (ansible_facts.distribution_major_version | int) == (debian_stable_major | int)
            else
            'Installierte Hauptversion ist neuer als Stable; Release-Kanal prüfen.'
          }}
      when:
        - ansible_facts.distribution == "Debian"
        - debian_stable_major is defined
        - debian_stable_codename is defined

    - name: Hinweis für Home Assistant vorbereiten
      ansible.builtin.set_fact:
        debian_hinweis: >-
          Debian {{ ansible_facts.distribution_major_version }}
          ({{ ansible_facts.distribution_release }}) installiert,
          aktuell stabil ist Debian {{ debian_stable_major }}
          ({{ debian_stable_codename }})
      when:
        - ansible_facts.distribution == "Debian"
        - debian_stable_major is defined
        - (ansible_facts.distribution_major_version | int) < (debian_stable_major | int)

    - name: Zurückgestellte Pakete, die nach dem Lauf installiert werden (im Testlauf keine)
      ansible.builtin.set_fact:
        deferred_to_install: "{{ [] if ansible_check_mode else deferred_now }}"

    - name: Anzahl installierter Updates ermitteln
      ansible.builtin.set_fact:
        installed_updates: >-
          {{ ((apt_upgrade.stdout | default('')) | regex_search('(\d+) upgraded, (\d+) newly installed', '\1', '\2') | default([0, 0], true) | map('int') | sum)
             + (deferred_now | length) }}
      when: not ansible_check_mode   # im Testlauf wird nichts installiert; zurückgestellte Pakete zählen als installiert

    - name: Ergebnis für Home Assistant melden
      ansible.builtin.debug:
        msg: >-
          HA_RESULT {{ {
            'updates': (upgrade_final.stdout_lines | select('match', '^Inst ') | map('regex_replace', '^Inst (\S+).*$', '\1') | reject('in', deferred_to_install) | list | length),
            'reboot_required': reboot_required.stat.exists,
            'packages': (upgrade_final.stdout_lines | select('match', '^Inst ') | map('regex_replace', '^Inst (\S+).*$', '\1') | reject('in', deferred_to_install) | list),
            'disk_free_mib': ((root_available_kib.stdout_lines[-1] | int) / 1024) | round(1),
            'disk_required_mib': ((required_space_kib.stdout | default('0') | trim | int) / 1024) | round(1),
            'disk_used_percent': ((1 - ((root_available_kib.stdout_lines[-1] | int) / (root_total_kib.stdout_lines[-1] | int))) * 100) | round(1),
            'notes': ([debian_hinweis] if debian_hinweis is defined else [])
                     + ([(('Wird' if deferred_to_install | length == 1 else 'Werden') if not ansible_check_mode else 'Würde' if deferred_now | length == 1 else 'Würden')
                         ~ ' nach dem Lauf im Hintergrund installiert: ' ~ (deferred_now | join(', '))] if deferred_now | length > 0 else [])
          } | combine({'installed': installed_updates | int} if installed_updates is defined else {}) | to_json }}

# Zweites Play: läuft erst, wenn ALLE Hosts des ersten Plays fertig sind (inkl. HA_RESULT).
# Der Job wird von systemd gestartet und hängt nicht an der SSH-Sitzung: Er überlebt das Ende von
# Semaphore, falls der Docker-Neustart Semaphore selbst beendet.
- name: Zurückgestellte Pakete im Hintergrund installieren
  hosts: linux_guests
  become: true
  gather_facts: false

  # Play-Variablen gelten nicht über Plays hinweg: hier noch einmal (Extra-Vars/host_vars überschreiben beide)
  vars:
    deferred_upgrade_delay_seconds: 45

  tasks:
    - name: Hintergrund-Update starten
      ansible.builtin.command:
        argv:
          - systemd-run
          - --no-block
          - --collect
          - --unit=semaphore-deferred-upgrade
          - --description=Zurückgestellte Paket-Updates (Semaphore)
          - /bin/sh
          - -c
          - >-
            sleep {{ deferred_upgrade_delay_seconds | int }};
            DEBIAN_FRONTEND=noninteractive exec apt-get install -y --only-upgrade
            -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold
            {{ deferred_to_install | join(' ') }}
      when: deferred_to_install | default([]) | length > 0
      changed_when: true
