blueprint:
  name: Semaphore UI – Benachrichtigung bei Taskende
  author: 19Andy89
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  source_url: https://github.com/19Andy89/ha_semaphoreui/blob/main/blueprints/automation/ha_semaphoreui/semaphore_task_result.yaml
  description: >-
    Schickt eine Benachrichtigung, wenn ein Semaphore-Task endet (auch bei Tasks, die in Semaphore oder per Zeitplan
    gestartet wurden). Der Text kommt fertig aus der Integration (Ergebnis, Dauer, Fehlergrund, Handlungsbedarf).
    Voraussetzung: die Integration „Semaphore UI“ (ha_semaphoreui).
  input:
    notify_entities:
      name: Benachrichtigen
      description: Eine oder mehrere Benachrichtigungs-Entitäten (z. B. dein Handy aus der Companion-App).
      selector:
        entity:
          domain: notify
          multiple: true
    when:
      name: Wann benachrichtigen?
      description: >-
        „Fehler und Handlungsbedarf“ meldet auch erfolgreiche Läufe, bei denen das Playbook `HA_RESULT` mit
        `needed: true` ausgibt. Ein nächtlicher Testlauf meldet offene Updates dann jede Nacht, bis sie installiert sind.
      default: problems
      selector:
        select:
          mode: list
          options:
            - label: Nur bei Fehlern
              value: failed
            - label: Bei Fehlern und bei Handlungsbedarf
              value: problems
            - label: Bei jedem Ergebnis
              value: all
    notify_updates:
      name: Auch bei offenen Updates benachrichtigen
      description: >-
        Meldet jeden Lauf, nach dem noch Updates offen sind (`updates` größer 0 im `HA_RESULT`) – unabhängig von
        „Wann benachrichtigen?“. Sinnvoll zusammen mit „Nur bei Fehlern“: dann kommt kein Hinweis nur wegen eines
        nötigen Neustarts. Bei „Fehler und Handlungsbedarf“ sind offene Updates ohnehin enthalten.
      default: false
      selector:
        boolean: {}
    show_hosts:
      name: Anzahl je Host anzeigen
      description: >-
        Hängt der Nachricht eine Zeile pro Host an, z. B. „pve: 28 Updates · Neustart nötig“ oder
        „docker: aktuell · 5 installiert“. Nur bei Playbooks, die `HA_RESULT` je Host melden.
      default: true
      selector:
        boolean: {}
    include_dry_runs:
      name: Testläufe einbeziehen
      description: "Aus = Testläufe (Dry-Run) lösen keine Benachrichtigung aus."
      default: true
      selector:
        boolean: {}
    only_templates:
      name: Nur diese Templates (optional)
      description: Namen der Semaphore-Templates, genau wie in Semaphore geschrieben. Leer = alle Templates.
      default: []
      selector:
        text:
          multiple: true
    extra_actions:
      name: Zusätzliche Aktionen (optional)
      description: >-
        Läuft nach der Benachrichtigung. Der Bericht steht in `trigger.event.data` (z. B. `title`, `text`, `url`,
        `result`, `template`, `ha_result`).
      default: []
      selector:
        action: {}

mode: queued
max: 10

variables:
  when: !input when
  notify_updates: !input notify_updates
  show_hosts: !input show_hosts
  include_dry_runs: !input include_dry_runs
  only_templates: !input only_templates

triggers:
  - trigger: event
    event_type: semaphore_ui_task_finished

conditions:
  - condition: template
    value_template: >-
      {% set d = trigger.event.data %}
      {% set failed = d.result == 'failed' %}
      {% set action = (d.ha_result is mapping) and (d.ha_result.get('needed', false) | bool(false)) %}
      {% set pending = (d.ha_result is mapping) and ((d.ha_result.get('updates', 0) | int(0)) > 0) %}
      {% set by_result = (d.result != 'stopped' or when == 'all') and
         (when == 'all' or failed or (when == 'problems' and action) or (notify_updates and pending)) %}
      {% set by_dry_run = include_dry_runs or not d.dry_run %}
      {% set by_template = (only_templates | length == 0) or (d.template in only_templates) %}
      {{ by_result and by_dry_run and by_template }}

actions:
  - action: notify.send_message
    target:
      entity_id: !input notify_entities
    data:
      title: "{{ trigger.event.data.title }}"
      message: >-
        {% set d = trigger.event.data %}{{ d.text }}
        {%- set hosts = d.ha_result.get('hosts') if d.ha_result is mapping else none %}
        {%- if show_hosts and hosts is mapping and hosts | length > 0 %}
        {%- for name, h in hosts.items() | sort %}
        {%- set u = h.get('updates') %}
        {%- set bits = [] %}
        {%- if u is number %}{% set bits = bits + [('aktuell' if u == 0 else (u | int ~ (' Update' if u == 1 else ' Updates')))] %}{% endif %}
        {%- if (h.get('installed') or 0) > 0 %}{% set bits = bits + [h.installed | int ~ ' installiert'] %}{% endif %}
        {%- if h.get('reboot_required') %}{% set bits = bits + ['Neustart nötig'] %}{% endif %}
        {{- '\n' }}• {{ name }}: {{ bits | join(' · ') if bits else 'keine Angaben' }}
        {%- endfor %}
        {%- endif %}
  - choose: []
    default: !input extra_actions
